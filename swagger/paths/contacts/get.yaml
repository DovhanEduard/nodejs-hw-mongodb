tags:
  - Contacts
summary: Get contacts
operationId: getAllConatcts
description: 'Get list of contacts with this endpoint'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
    example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: 'name'
    description: 'Field by which to sort the contacts. Default value - _id'
  - in: query
    name: sortOrder
    schema:
      type: string
      example: 'asc'
    description: 'Field by which to sort the contacts. Default value - asc'
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
    description: 'Field by which to filter the contacts'
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: 'Field by which to filter the contacts'
responses:
  '200':
    description: 'Successfully found contacts!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
